[package]
name = "botgroup-chat-desktop"
version = "1.0.11"
description = "BotGroup.Chat - AI Group Chat Desktop App"
authors = ["BotGroup.Chat Team"]
edition = "2021"

[lib]
name = "botgroup_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.8.0", features = ["v4"] }
chrono = { version = "0.4.38", features = ["serde"] }
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }
which = "6"
rfd = "0.14"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
